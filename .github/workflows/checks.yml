name: Desktop checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            qt: "PySide6>=6.8,<6.9"
            scale: "1"
          - python: "3.12"
            qt: "PySide6>=6.8,<7"
            scale: "1.5"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt
        run: python -m pip install "${{ matrix.qt }}"
      - name: Compile and run tests
        run: |
          python -m compileall -q fruc_app tools tests
          python -m unittest discover -v
      - name: Capture real Qt layouts with illustrative queue data
        if: always()
        run: python tools/capture_ui.py --output ui-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-ui-python-${{ matrix.python }}-scale-${{ matrix.scale }}
          path: ui-captures/*.png
          if-no-files-found: warn
